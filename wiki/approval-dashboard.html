<title>LLM-Wiki · Source Approval</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F4F6FB;--surface:#FFFFFF;--surface2:#EEF1F8;--border:#D4D9E8;--border2:#C2CAE0;
  --sapphire:#1E40AF;--sapphire-lt:#EFF3FF;
  --text:#111827;--text2:#3D4A63;--muted:#6B7A99;--faint:#A0ABBE;
  --ok:#065F46;--ok-lt:#D1FAE5;--ok-bg:#F0FDF4;
  --warn:#92400E;--warn-lt:#FEF3C7;--warn-bg:#FFFBEB;
  --crit:#991B1B;--crit-lt:#FEE2E2;--crit-bg:#FFF5F5;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  --mono:'Cascadia Code','Menlo','Monaco','Courier New',monospace;
  --r:6px;--r-card:8px;
  --sh:0 1px 2px rgba(17,24,39,.06),0 1px 4px rgba(17,24,39,.04);
  --sh-md:0 4px 12px rgba(17,24,39,.08),0 1px 3px rgba(17,24,39,.05);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0C1120;--surface:#141C2E;--surface2:#1A2540;--border:#263050;--border2:#31406A;
  --sapphire:#4B79F5;--sapphire-lt:#1A2550;
  --text:#E8EDF7;--text2:#A8B5D0;--muted:#6B7FA8;--faint:#404D6A;
  --ok:#34D399;--ok-lt:#064E3B;--ok-bg:#022C22;
  --warn:#FCD34D;--warn-lt:#78350F;--warn-bg:#451A03;
  --crit:#F87171;--crit-lt:#7F1D1D;--crit-bg:#450A0A;
  --sh:0 1px 2px rgba(0,0,0,.3);--sh-md:0 4px 12px rgba(0,0,0,.4);
}}
:root[data-theme="light"]{
  --bg:#F4F6FB;--surface:#FFFFFF;--surface2:#EEF1F8;--border:#D4D9E8;--border2:#C2CAE0;
  --sapphire:#1E40AF;--sapphire-lt:#EFF3FF;
  --text:#111827;--text2:#3D4A63;--muted:#6B7A99;--faint:#A0ABBE;
  --ok:#065F46;--ok-lt:#D1FAE5;--ok-bg:#F0FDF4;
  --warn:#92400E;--warn-lt:#FEF3C7;--warn-bg:#FFFBEB;
  --crit:#991B1B;--crit-lt:#FEE2E2;--crit-bg:#FFF5F5;
  --sh:0 1px 2px rgba(17,24,39,.06),0 1px 4px rgba(17,24,39,.04);
  --sh-md:0 4px 12px rgba(17,24,39,.08),0 1px 3px rgba(17,24,39,.05);
}
:root[data-theme="dark"]{
  --bg:#0C1120;--surface:#141C2E;--surface2:#1A2540;--border:#263050;--border2:#31406A;
  --sapphire:#4B79F5;--sapphire-lt:#1A2550;
  --text:#E8EDF7;--text2:#A8B5D0;--muted:#6B7FA8;--faint:#404D6A;
  --ok:#34D399;--ok-lt:#064E3B;--ok-bg:#022C22;
  --warn:#FCD34D;--warn-lt:#78350F;--warn-bg:#451A03;
  --crit:#F87171;--crit-lt:#7F1D1D;--crit-bg:#450A0A;
  --sh:0 1px 2px rgba(0,0,0,.3);--sh-md:0 4px 12px rgba(0,0,0,.4);
}
html{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;height:100%}
body{height:100%}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* Header */
#hd{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.25rem;height:48px;display:flex;align-items:center;gap:1rem;flex-shrink:0;z-index:40}
#hd-brand{display:flex;align-items:baseline;gap:.5rem}
.wm{font-size:.8rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--sapphire)}
.ws{font-size:.7rem;color:var(--muted);font-family:var(--mono)}
.sp{flex:1}
.hb{height:28px;padding:0 .75rem;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text2);font-size:.72rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:.3rem;transition:background .12s,border-color .12s;font-family:inherit}
.hb:hover{background:var(--surface2);border-color:var(--border2)}
.hb-p{background:var(--sapphire);color:#fff;border-color:var(--sapphire)}
.hb-p:hover{opacity:.88}

/* Stats */
#sb{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.25rem;height:36px;display:flex;align-items:center;gap:2rem;flex-shrink:0;overflow-x:auto}
.st{display:flex;align-items:center;gap:.4rem;font-size:.72rem;white-space:nowrap;color:var(--muted)}
.sv{font-weight:700;color:var(--text);font-family:var(--mono);font-variant-numeric:tabular-nums}
.sd{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* Shell */
#shell{flex:1;display:flex;overflow:hidden}

/* Sidebar */
#nav{width:182px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;padding:.5rem 0}
.nl{font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:.75rem 1rem .3rem}
.ct{display:flex;align-items:center;gap:.5rem;padding:.38rem 1rem .38rem .875rem;border-left:3px solid transparent;cursor:pointer;font-size:.78rem;color:var(--muted);transition:background .1s,color .1s,border-color .1s;line-height:1.3}
.ct:hover{background:var(--surface2);color:var(--text2)}
.ct.on{border-left-color:var(--sapphire);background:var(--sapphire-lt);color:var(--sapphire);font-weight:600}
.ca{font-family:var(--mono);font-size:.63rem;font-weight:700;width:22px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:3px;background:var(--surface2);color:var(--faint);flex-shrink:0}
.ct.on .ca{background:var(--sapphire);color:#fff}
.cl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc{font-family:var(--mono);font-size:.65rem;font-variant-numeric:tabular-nums;color:var(--faint);flex-shrink:0}
.ct.on .cc{color:var(--sapphire)}

/* Content */
#content{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* Toolbar */
#tb{padding:.75rem 1.25rem .5rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;background:var(--bg);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border)}
#srch{height:30px;padding:0 .75rem;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:.78rem;outline:none;width:220px;transition:border-color .12s,box-shadow .12s;font-family:inherit}
#srch:focus{border-color:var(--sapphire);box-shadow:0 0 0 2px rgba(30,64,175,.15)}
#srch::placeholder{color:var(--faint)}
.chips{display:flex;gap:.3rem;flex-wrap:wrap}
.chip{height:26px;padding:0 .6rem;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--muted);font-size:.7rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;transition:all .1s;white-space:nowrap;font-family:inherit}
.chip:hover{background:var(--surface2);color:var(--text2)}
.chip.on{background:var(--sapphire);color:#fff;border-color:var(--sapphire)}
.chip.on-ok{background:var(--ok-lt);color:var(--ok);border-color:var(--ok)}
.chip.on-wa{background:var(--warn-lt);color:var(--warn);border-color:var(--warn)}
.chip.on-cr{background:var(--crit-lt);color:var(--crit);border-color:var(--crit)}
.csep{width:1px;background:var(--border);margin:0 .2rem;align-self:stretch;display:inline-block}

/* Suggest */
#sgp{margin:.25rem 1.25rem;border:1px solid var(--sapphire);border-radius:var(--r-card);background:var(--sapphire-lt);padding:.6rem .85rem;display:none}
#sgp.show{display:block}
#sgp h4{font-size:.67rem;font-weight:700;color:var(--sapphire);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.07em}
.sgl{display:flex;flex-direction:column;gap:.2rem}
.sgi{display:flex;align-items:center;gap:.5rem;padding:.3rem .5rem;border-radius:4px;cursor:pointer;font-size:.75rem;color:var(--text2);transition:background .1s}
.sgi:hover{background:var(--surface2)}
.sgi .ssc{font-family:var(--mono);font-size:.65rem;color:var(--faint);margin-left:auto}

/* Result line */
#rl{padding:.35rem 1.25rem .15rem;font-size:.7rem;color:var(--faint);font-family:var(--mono)}

/* Grid */
#grid{padding:.75rem 1.25rem 2rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.75rem}

/* Card */
.ec{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border2);border-radius:var(--r-card);padding:.85rem .9rem;display:flex;flex-direction:column;gap:.5rem;box-shadow:var(--sh);transition:box-shadow .15s}
.ec:hover{box-shadow:var(--sh-md)}
.ec.sA{border-left-color:var(--ok);background:var(--ok-bg)}
.ec.sR{border-left-color:var(--crit);background:var(--crit-bg);opacity:.7}
.ec.sN{border-left-color:var(--warn);background:var(--warn-bg)}
.ec-hd{display:flex;gap:.5rem;align-items:flex-start}
.ec-id{font-family:var(--mono);font-size:.63rem;color:var(--faint);flex-shrink:0;padding-top:2px}
.ec-ti{font-size:.82rem;font-weight:600;color:var(--text);flex:1;line-height:1.35;word-break:break-word}
.ec-fn{font-family:var(--mono);font-size:.63rem;color:var(--muted);word-break:break-all;line-height:1.4}
.ec-tg{display:flex;flex-wrap:wrap;gap:.25rem}
.ec-me{display:flex;flex-wrap:wrap;gap:.2rem .25rem;align-items:center}
.ec-dm{font-size:.65rem;color:var(--faint);font-family:var(--mono)}
.ec-nt{font-size:.73rem;color:var(--text2);border-top:1px solid var(--border);padding-top:.45rem;line-height:1.45}
.ec-ac{display:flex;gap:.3rem;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:.5rem}
.ab{height:24px;padding:0 .55rem;border-radius:4px;border:1px solid;font-size:.68rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:.2rem;transition:opacity .1s,background .1s;font-family:inherit}
.ab:hover{opacity:.82}
.ab-ok{background:var(--ok-lt);color:var(--ok);border-color:var(--ok)}
.ab-wa{background:var(--warn-lt);color:var(--warn);border-color:var(--warn)}
.ab-cr{background:var(--crit-lt);color:var(--crit);border-color:var(--crit)}
.ab-gh{background:var(--surface);color:var(--muted);border-color:var(--border)}
.ab-gh:hover{background:var(--surface2);color:var(--text2)}
.ec-ni{display:none;width:100%;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);font-size:.73rem;font-family:inherit;padding:.35rem .5rem;resize:vertical;min-height:48px;margin-top:.2rem}
.ec-ni.show{display:block}
.ec-ni:focus{outline:none;border-color:var(--sapphire)}

/* Badges */
.b{display:inline-flex;align-items:center;padding:.08rem .42rem;border-radius:3px;font-size:.63rem;font-weight:700;font-family:var(--mono);letter-spacing:.01em}
.bP0{background:#450A0A;color:#FCA5A5}
.bP1{background:#431407;color:#FED7AA}
.bP2{background:var(--sapphire-lt);color:var(--sapphire)}
.bP3,.bP4{background:var(--surface2);color:var(--muted)}
.bPX{background:var(--surface2);color:var(--faint);text-decoration:line-through}
.bA{background:var(--ok-lt);color:var(--ok)}
.bB{background:#DBEAFE;color:#1E40AF}
.bC{background:#EDE9FE;color:#5B21B6}
.bD,.bE{background:var(--surface2);color:var(--muted)}
.bHI{background:var(--ok-lt);color:var(--ok)}
.bME{background:var(--warn-lt);color:var(--warn)}
.bLO{background:var(--crit-lt);color:var(--crit)}
.bCL{background:var(--surface2);color:var(--text2);font-weight:500;font-family:var(--font);font-size:.65rem}
.bIN{background:var(--ok-lt);color:var(--ok)}
.bRV{background:var(--warn-lt);color:var(--warn)}
.bAR{background:var(--surface2);color:var(--faint)}
.bSA{background:var(--ok-lt);color:var(--ok)}
.bSR{background:var(--crit-lt);color:var(--crit)}
.bSN{background:var(--warn-lt);color:var(--warn)}
.bSP{background:var(--surface2);color:var(--muted)}
@media(prefers-color-scheme:dark){.bB{background:#1E3A5F;color:#93C5FD}.bC{background:#2E1065;color:#C4B5FD}}
:root[data-theme="dark"] .bB{background:#1E3A5F;color:#93C5FD}
:root[data-theme="dark"] .bC{background:#2E1065;color:#C4B5FD}
:root[data-theme="light"] .bB{background:#DBEAFE;color:#1E40AF}
:root[data-theme="light"] .bC{background:#EDE9FE;color:#5B21B6}

/* Empty */
#empty{display:none;padding:4rem 1.25rem;text-align:center;color:var(--faint);font-size:.85rem}

/* Toast */
#toast{position:fixed;bottom:1.25rem;right:1.25rem;background:var(--text);color:var(--bg);padding:.5rem 1rem;border-radius:var(--r);font-size:.75rem;font-weight:600;box-shadow:var(--sh-md);z-index:99;opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s;pointer-events:none}
#toast.show{opacity:1;transform:none}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
@media(max-width:640px){#nav{display:none}#grid{grid-template-columns:1fr}}
</style>

</div>

let entries=DATA.map(e=>({...e}));
const SK='llmwiki_appr_v3';
let aC='ALL',aSt='ALL',aAc='ALL',sQ='';

function persist(){
  const o={};entries.forEach(e=>{o[e.id]={s:e.status,n:e.reviewer_note||''}});
  try{localStorage.setItem(SK,JSON.stringify(o))}catch(_){}
}
function restore(){
  try{const d=JSON.parse(localStorage.getItem(SK)||'{}');
    entries.forEach(e=>{if(d[e.id]){e.status=d[e.id].s;e.reviewer_note=d[e.id].n||''}})
  }catch(_){}
}

const CM={
  'ALL':{ab:'ALL',lb:'All Files'},
  'registry-index':{ab:'REG',lb:'Registry & Index'},
  'ai-os-dashboards':{ab:'DSH',lb:'AI-OS Dashboards'},
  'knowledge-management':{ab:'KNW',lb:'Knowledge Mgmt'},
  'llm-engineering':{ab:'LLM',lb:'LLM Engineering'},
  'workflow-automation':{ab:'WFA',lb:'Workflow & Auto.'},
  'engineering-ec2':{ab:'EC2',lb:'Engineering EC2'},
  'bookmarks-links':{ab:'BKM',lb:'Bookmarks'},
  'zotterconsult-projects':{ab:'ZCO',lb:'ZotterConsult'},
  'images-visuals':{ab:'IMG',lb:'Images & Visuals'},
  'tools-code':{ab:'COD',lb:'Tools & Code'},
};
const CO=Object.keys(CM);

function buildNav(){
  const cnt={ALL:entries.length};entries.forEach(e=>{cnt[e.cluster]=(cnt[e.cluster]||0)+1});
  document.getElementById('nav').innerHTML='<div class="nl">Clusters</div>'+CO.map(c=>{
    const m=CM[c]||{ab:c.slice(0,3).toUpperCase(),lb:c};
    return`<div class="ct${c==='ALL'?' on':''}" data-c="${c}" onclick="pickC('${c}',this)"><span class="ca">${m.ab}</span><span class="cl">${m.lb}</span><span class="cc">${cnt[c]||0}</span></div>`;
  }).join('');
}
function pickC(c,el){aC=c;document.querySelectorAll('.ct').forEach(t=>t.classList.remove('on'));el.classList.add('on');render()}

function setSt(v,el){
  aSt=v;
  document.querySelectorAll('#st-chips .chip').forEach(c=>{c.className=c.className.replace(/\bon(-\w+)?\b/g,'').trim().replace(/\s+/g,' ')});
  el.classList.add(v==='APPROVED'?'on-ok':v==='NEEDS_REVISION'?'on-wa':v==='REJECTED'?'on-cr':'on');
  render();
}
function setAc(v,el){
  aAc=v;
  document.querySelectorAll('#ac-chips .chip').forEach(c=>{c.className=c.className.replace(/\bon(-\w+)?\b/g,'').trim().replace(/\s+/g,' ')});
  el.classList.add(v==='INGEST'?'on-ok':v==='REVIEW'?'on-wa':'on');
  render();
}

function tok(s){return s.toLowerCase().split(/\W+/).filter(t=>t.length>1)}
function scr(e,qt){
  if(!qt.length)return 1;
  const bag=tok([e.title,e.filename,e.cluster,...(e.tags||[])].join(' '));
  return qt.filter(t=>bag.some(b=>b.startsWith(t))).length/qt.length;
}
function onSearch(v){
  sQ=v.trim().toLowerCase();
  if(sQ.length>=2)showSug(sQ);
  else document.getElementById('sgp').classList.remove('show');
  render();
}
function showSug(q){
  const qt=tok(q);
  const hits=entries.map(e=>({e,s:scr(e,qt)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,6);
  if(!hits.length){document.getElementById('sgp').classList.remove('show');return}
  document.getElementById('sgp').classList.add('show');
  document.getElementById('sgl').innerHTML=hits.map(({e,s})=>
    `<div class="sgi" onclick="jumpTo('${e.id}')"><span class="b bP${(e.priority||'X').slice(1)}">${e.priority}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.title)}</span><span class="b bCL">${esc(e.cluster_label||e.cluster)}</span><span class="ssc">${(s*100).toFixed(0)}%</span></div>`
  ).join('');
}
function jumpTo(id){
  sQ='';document.getElementById('srch').value='';
  document.getElementById('sgp').classList.remove('show');
  aC='ALL';document.querySelectorAll('.ct').forEach(t=>t.classList.remove('on'));
  document.querySelector('[data-c="ALL"]').classList.add('on');
  render();
  requestAnimationFrame(()=>{const el=document.getElementById('c-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})});
}

function setES(id,st){
  const e=entries.find(x=>x.id===id);if(!e)return;
  e.status=st;
  const ni=document.getElementById('ni-'+id);if(ni)e.reviewer_note=ni.value;
  persist();refreshCard(e);updateStats();
  toast(st==='APPROVED'?'Approved':st==='REJECTED'?'Rejected':st==='NEEDS_REVISION'?'Flagged for revision':'Reset');
}
function togN(id){const el=document.getElementById('ni-'+id);if(el)el.classList.toggle('show')}
function savN(id){
  const el=document.getElementById('ni-'+id);const e=entries.find(x=>x.id===id);
  if(e&&el){e.reviewer_note=el.value;persist();toast('Note saved')}
}

function pb(p){const n=(p||'PX').slice(1);return`<span class="b bP${n}">${p}</span>`}
function ab2(a){return`<span class="b b${a||'E'}">Auth-${a||'E'}</span>`}
function cb(c){const k={HIGH:'HI',MED:'ME',LOW:'LO'}[c]||'LO';return`<span class="b b${k}">${c}</span>`}
function acb(a){const k={INGEST:'IN',REVIEW:'RV',ARCHIVE:'AR'}[a]||'RV';return`<span class="b b${k}">${a}</span>`}
function stb(s){const k={APPROVED:'A',REJECTED:'R',NEEDS_REVISION:'N',PENDING_REVIEW:'P'}[s]||'P';return`<span class="b bS${k}">${s.replace(/_/g,' ')}</span>`}
function fmtB(b){return b<1024?b+'B':b<1048576?(b/1024).toFixed(0)+'KB':(b/1048576).toFixed(1)+'MB'}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function cardInner(e){
  const alts=(e.cluster_suggestions||[]).slice(0,2).map(s=>
    `<span class="b bCL" style="cursor:pointer" onclick="pickCN('${s.cluster}')" title="Alt cluster">${esc(s.cluster)} ${(s.score*100).toFixed(0)}%</span>`
  ).join('');
  return`
<div class="ec-hd"><span class="ec-id">${esc(e.id)}</span><div style="flex:1"><div class="ec-ti">${esc(e.title)}</div><div class="ec-fn">${esc(e.filename)}</div></div></div>
<div class="ec-tg">${pb(e.priority)} ${ab2(e.authority_class)} ${cb(e.confidence)} ${acb(e.recommended_action)} ${stb(e.status)}</div>
<div class="ec-me"><span class="b bCL">${esc(e.cluster_label||e.cluster)}</span><span class="ec-dm">${fmtB(e.file_size_bytes)}</span><span class="ec-dm">${esc(e.file_date)}</span><span class="ec-dm">${esc(e.file_ext||'--')}</span>${alts}</div>
${e.ingest_note?`<div class="ec-nt">${esc(e.ingest_note)}</div>`:''}
<div class="ec-ac">
  <button class="ab ab-ok" onclick="setES('${e.id}','APPROVED')">Approve</button>
  <button class="ab ab-wa" onclick="setES('${e.id}','NEEDS_REVISION')">Revise</button>
  <button class="ab ab-cr" onclick="setES('${e.id}','REJECTED')">Reject</button>
  <button class="ab ab-gh" onclick="togN('${e.id}')">Note</button>
  ${e.status!=='PENDING_REVIEW'?`<button class="ab ab-gh" onclick="setES('${e.id}','PENDING_REVIEW')">Reset</button>`:''}
</div>
<textarea class="ec-ni" id="ni-${e.id}" placeholder="Reviewer note..." onblur="savN('${e.id}')">${esc(e.reviewer_note||'')}</textarea>`;
}

function refreshCard(e){
  const el=document.getElementById('c-'+e.id);if(!el)return;
  const cls={'APPROVED':'sA','REJECTED':'sR','NEEDS_REVISION':'sN','PENDING_REVIEW':''}[e.status]||'';
  el.className=`ec ${cls}`.trim();el.innerHTML=cardInner(e);
}
function pickCN(n){
  aC=n;document.querySelectorAll('.ct').forEach(t=>t.classList.remove('on'));
  const t=document.querySelector(`[data-c="${n}"]`);if(t)t.classList.add('on');render();
}

const PO={P0:0,P1:1,P2:2,P3:3,P4:4,PX:5};
function getFilt(){
  const qt=sQ?tok(sQ):[];
  return entries.filter(e=>{
    if(aC!=='ALL'&&e.cluster!==aC)return false;
    if(aSt!=='ALL'&&e.status!==aSt)return false;
    if(aAc!=='ALL'&&e.recommended_action!==aAc)return false;
    if(qt.length&&scr(e,qt)===0)return false;
    return true;
  }).sort((a,b)=>(PO[a.priority]??9)-(PO[b.priority]??9)||b.file_date.localeCompare(a.file_date));
}

function render(){
  const f=getFilt();
  const grid=document.getElementById('grid');
  document.getElementById('rl').textContent=`${f.length} / ${entries.length}`;
  if(!f.length){grid.innerHTML='';document.getElementById('empty').style.display='block';updateStats();return}
  document.getElementById('empty').style.display='none';
  const cls={APPROVED:'sA',REJECTED:'sR',NEEDS_REVISION:'sN',PENDING_REVIEW:''};
  grid.innerHTML=f.map(e=>`<div class="ec ${(cls[e.status]||'').trim()}" id="c-${e.id}">${cardInner(e)}</div>`).join('');
  updateStats();
}

function updateStats(){
  document.getElementById('s0').textContent=entries.length;
  document.getElementById('s1').textContent=entries.filter(e=>e.status==='APPROVED').length;
  document.getElementById('s2').textContent=entries.filter(e=>e.status==='PENDING_REVIEW').length;
  document.getElementById('s3').textContent=entries.filter(e=>e.status==='REJECTED').length;
  document.getElementById('s4').textContent=entries.filter(e=>e.status==='NEEDS_REVISION').length;
  document.getElementById('s5').textContent=entries.filter(e=>e.priority==='P0'||e.priority==='P1').length;
}

function exportApproved(){dl(entries.filter(e=>e.status==='APPROVED'),'registry_approved.jsonl')}
function exportAll(){dl(entries,'registry_full.jsonl')}
function dl(data,name){
  const blob=new Blob([data.map(e=>JSON.stringify(e)).join('\n')],{type:'application/x-ndjson'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  toast(data.length+' entries exported');
}

function toggleTheme(){
  const r=document.documentElement;
  const n=r.getAttribute('data-theme')==='dark'?'light':'dark';
  r.setAttribute('data-theme',n);
  try{localStorage.setItem('llmwiki_theme',n)}catch(_){}
  document.getElementById('themebtn').textContent=n==='dark'?'Light':'Dark';
}
function initTheme(){
  let t;try{t=localStorage.getItem('llmwiki_theme')}catch(_){}
  if(!t)t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themebtn').textContent=t==='dark'?'Light':'Dark';
}

let _tt;
function toast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2000);
}

initTheme();restore();buildNav();render();
</script>
