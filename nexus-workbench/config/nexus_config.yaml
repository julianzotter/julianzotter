  ID01: {role: "Human AI / Orchestrator", provider: "human",       active: true}
  ID02: {role: "Orchestrator",            provider: "ChatGPT",     active: true}
  ID03: {role: "Reviewer",               provider: "ChatGPT",     active: true}
  ID04: {role: "Colab Executor",         provider: "Gemini",      active: true}
  ID05: {role: "Research",               provider: "Perplexity",  active: true}
  ID06: {role: "Code / Architecture",    provider: "Claude",      model: "claude-sonnet-4-6", active: true}
  ID07: {role: "Offline / Air-Gap",      provider: "DeepSeek",    active: false}
  ID08: {role: "Local Inference",        provider: "Ollama",      active: false, optional: true}

# ── Feedback / WORM Ledger Schema ───────────────────────────────────────────
feedback_schema:
  fields: [ts, from, case_id, status, payload]
  ts_format: "ISO8601-UTC"        # datetime.utcnow().isoformat() + "Z"
  valid_status: [INFO, PASS, FAIL, WARN, ERROR]
  append_only: true

# ── Save Convention (save_v3) ───────────────────────────────────────────────
save:
  dual_write: true                # writes {name}_{ts}.ext AND {name}_v1.ext
  sha_length: 12                  # first 12 chars of sha256 of first 200 KB

# ── VERBOTEN (global — must never appear in committed code or Colab) ────────
forbidden:
  paths:
    - "_development"              # deleted folder — WRONG spelling (without 'e')
  functions:
    - "save_to_workspace()"
    - "threading.Timer"
  features:
    - "Dashboard"
    - "Voice"
    - "Three.js"
    - "IFC"
