# ── Kernel Output Schema (alle Kernels müssen diese Felder liefern) ─────────
kernel_output_schema:
  required:
    - norm_tag         # z.B. "EC2"
    - material_tag     # z.B. "BETON-STAHL"
    - nachweis_typ     # z.B. "BIEGE"
    - status           # "PASS" | "FAIL"
    - eta              # Ausnutzungsgrad 0..1
    - case_id          # aus golden_case oder runtime-generiert
  optional:
    - delta_pct        # Abweichung zu Handrechnung in %
    - M_Ed_kNm
    - V_Ed_kN
    - As_req_cm2
    - As_prov_cm2
