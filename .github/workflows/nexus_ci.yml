name: NEXUS AI-OS CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  security-gate:
    name: AP2 Security Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run secret_scan.py
        run: python nexus-workbench/scripts/secret_scan.py .

  validate-config:
    name: Validate Config Files
    runs-on: ubuntu-latest
    needs: security-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Validate nexus_config.yaml
        run: |
          python -c "
          import yaml, sys
          with open('nexus-workbench/config/nexus_config.yaml') as f:
              cfg = yaml.safe_load(f)
          assert cfg.get('version'), 'version missing'
          assert cfg.get('mandant') == 'ZOTTERCONSULT_EU', 'mandant mismatch'
          # Verify KANON path has 'e'
          work = cfg['drive']['work']
          assert '_developement' in work, f'KANON path violation: {work}'
          assert '_development/' not in work, f'VERBOTEN path in config: {work}'
          print(f'[✓] nexus_config.yaml v{cfg[\"version\"]} valid')
          "
      - name: Validate signal_matrix.yaml
        run: |
          python -c "
          import yaml, sys
          with open('nexus-workbench/config/signal_matrix.yaml') as f:
              sm = yaml.safe_load(f)
          signals = sm.get('signals', [])
          assert signals, 'No signals defined'
          ids = [s['id'] for s in signals]
          assert len(ids) == len(set(ids)), 'Duplicate SM-IDs detected'
          for s in signals:
              assert 'norm_tag' in s, f'Missing norm_tag in {s.get(\"id\")}'
              assert 'nachweis_typ' in s, f'Missing nachweis_typ in {s.get(\"id\")}'
              assert 'status' in s, f'Missing status in {s.get(\"id\")}'
          print(f'[✓] signal_matrix.yaml: {len(signals)} signals, all IDs unique')
          "

  smoke-test-backend:
    name: Backend Smoke Test
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Test signal_matrix.py
        run: |
          cd nexus-workbench/backend
          python -c "
          from signal_matrix import detect_scope, compute
          scope = detect_scope('Fertigteilträger EC2 Beton')
          assert scope == 'FERTIGTEIL', f'Expected FERTIGTEIL, got {scope}'
          result = compute(scope)
          assert result.score > 0.8, f'Score too low: {result.score}'
          assert result.risk == 'HIGH', f'Expected HIGH risk, got {result.risk}'
          print(f'[✓] signal_matrix: scope={scope} score={result.score} risk={result.risk}')
          "
      - name: Test moe_router.py
        run: |
          cd nexus-workbench/backend
          python -c "
          from moe_router import route, sparsity
          experts = route('BETONBAU', top_k=2)
          active = [e for e in experts if e['active']]
          assert len(active) == 2, f'Expected 2 active experts, got {len(active)}'
          assert active[0]['expert'] == 'E-STATIK', f'Top expert mismatch: {active[0]}'
          sp = sparsity('BETONBAU', top_k=2)
          assert 0 < sp < 1
          print(f'[✓] moe_router: top experts={[e[\"expert\"] for e in active]} sparsity={sp}')
          "
      - name: Test kernel_router.py
        run: |
          cd nexus-workbench/backend
          python -c "
          import sys; sys.path.insert(0, '.')
          from kernel_router import route_kernel, coverage_report
          r = route_kernel('EC2', 'BIEGE')
          assert r['status'] == 'IMPLEMENTED', f'SM-001 should be IMPLEMENTED, got {r[\"status\"]}'
          assert r['kernel'] == 'ec2_fertigteil_kernel.py'
          r2 = route_kernel('EC99', 'UNKNOWN')
          assert r2['status'] == 'NOT_FOUND'
          cov = coverage_report()
          assert cov['total'] > 0
          print(f'[✓] kernel_router: EC2/BIEGE={r[\"status\"]}, coverage={cov[\"coverage_pct\"]}%')
          "

  forbidden-patterns:
    name: Check VERBOTEN Patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for forbidden patterns
        run: |
          echo "Checking for VERBOTEN patterns..."
          FAIL=0
          # Wrong folder name (without 'e')
          if grep -rn "_development[^e]" nexus-workbench/ --include="*.py" --include="*.yaml" --include="*.sh" --include="*.md" 2>/dev/null | grep -v "VERBOTEN\|DELETED\|without\|falsch\|wrong\|forbidden\|ohne"; then
              echo "[FAIL] Found '_development' (without 'e') in source files"
              FAIL=1
          fi
          # save_to_workspace()
          if grep -rn "save_to_workspace()" nexus-workbench/ --include="*.py" 2>/dev/null; then
              echo "[FAIL] Found forbidden save_to_workspace()"
              FAIL=1
          fi
          # threading.Timer
          if grep -rn "threading\.Timer" nexus-workbench/ --include="*.py" 2>/dev/null; then
              echo "[FAIL] Found forbidden threading.Timer"
              FAIL=1
          fi
          if [ $FAIL -eq 0 ]; then
              echo "[✓] No VERBOTEN patterns found"
          fi
          exit $FAIL
