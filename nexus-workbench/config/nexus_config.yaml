# ── Security Gates ──────────────────────────────────────────────────────────
security:
  ap2_secret_scan:        true   # scripts/secret_scan.py — must exit 0 before any upload
  ap3_inventory_scan:     true   # scripts/scan_inventory.py → data/source_registry.json
  worm_ledger_enabled:    true
  worm_merkle_chain:      false  # TODO: implement in log_feedback()
  ap2_script:             "nexus-workbench/scripts/secret_scan.py"
  ap3_script:             "nexus-workbench/scripts/scan_inventory.py"

